<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GenCon 2026 Preview</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Tabulator -->
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_bootstrap5.min.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3 py-2 flex-wrap">
  <span class="navbar-brand mb-0 h5">🎲 GenCon 2026 Preview</span>
  <!-- w-100 forces a line break in a wrapping flex container (Bootstrap trick) so this
       always gets its own full-width row and wraps normally, instead of being squeezed
       to near-zero width by the buttons and wrapping one word per line. -->
  <div id="meta-info" class="text-secondary small w-100"></div>
  <div class="d-flex flex-wrap gap-2 align-items-center">
    <button class="btn btn-sm btn-outline-primary" id="btn-refresh-preview" title="Pull the latest game list from BGG's GenCon 2026 Preview (public, no login)">
      ↻ Preview
    </button>
    <button class="btn btn-sm btn-outline-warning" id="btn-refresh-bgg" title="Log into BGG and pull your priority/notes on this preview list plus your collection status">
      ↻ My Data
    </button>
    <button class="btn btn-sm btn-outline-info" id="btn-export">⬇ Export</button>
    <label class="btn btn-sm btn-outline-info mb-0" for="import-file">⬆ Import</label>
    <input type="file" id="import-file" accept=".json" class="d-none" />
    <button class="btn btn-sm btn-outline-secondary" id="btn-clear-filters">Clear</button>
  </div>
  <div id="quick-filters" class="d-flex flex-wrap gap-2 align-items-center w-100 mt-1"></div>
</nav>

<div class="container-fluid px-3 py-2">
  <div id="toast-area" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>
  <div id="game-table"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
